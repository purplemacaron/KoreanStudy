<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>국어 형성 평가 | 읽기·쓰기·문학·대화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e6e8ec; --text:#1d1f24; --sub:#6b7280;
    --accent:#ff5a36; --accent-soft:#fff1ec; --ok:#16a34a; --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
       background:var(--bg);color:var(--text);line-height:1.65;word-break:keep-all}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px 120px}

  /* 상단 진행 바 */
  .topbar{position:sticky;top:0;z-index:10;background:rgba(245,246,248,.85);
          backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:820px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
  .topbar b{font-size:14px;white-space:nowrap}
  .bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  .count{font-size:13px;color:var(--sub);white-space:nowrap}

  /* 헤더 */
  header{padding:48px 0 28px}
  .tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);
       background:var(--accent-soft);padding:4px 10px;border-radius:99px;margin-bottom:12px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;color:var(--sub);font-size:14px}
  .info{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
  .info label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
  .info input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
              font:inherit;background:#fff}
  .info input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .notice{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;
          padding:14px 16px;font-size:13.5px;color:var(--sub)}
  .notice li{margin-left:18px}

  /* 섹션 */
  h2{font-size:18px;font-weight:800;margin:40px 0 14px;display:flex;align-items:center;gap:8px}
  h2::before{content:"";width:4px;height:18px;background:var(--accent);border-radius:2px}

  /* 문항 카드 */
  .q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
     padding:22px 22px 18px;margin-bottom:14px;transition:border-color .2s}
  .q.done{border-color:#cfd3da}
  .q-head{display:flex;gap:12px;align-items:flex-start}
  .q-num{flex:none;width:30px;height:30px;border-radius:9px;background:var(--text);color:#fff;
         font-weight:700;font-size:14px;display:grid;place-items:center}
  .q.done .q-num{background:var(--accent)}
  .q-text{flex:1;font-weight:600;font-size:15.5px;padding-top:3px}
  .pts{flex:none;font-size:12px;color:var(--sub);padding-top:6px}
  .box{margin:14px 0 4px 42px;padding:14px 16px;background:#fafbfc;border:1px dashed #d4d8de;
       border-radius:10px;font-size:14px}
  .box .bt{font-weight:700;font-size:12.5px;color:var(--sub);display:block;margin-bottom:4px}
  .cond{margin:10px 0 0 42px;font-size:13px;color:var(--accent);font-weight:600}

  .opts{display:flex;flex-direction:column;gap:6px;margin:14px 0 0 42px}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid transparent;
       border-radius:10px;cursor:pointer;font-size:14.5px;transition:.15s}
  .opt:hover{background:#f7f8fa}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #c9cdd4;
        display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--sub);transition:.15s}
  .opt:has(input:checked){background:var(--accent-soft);border-color:#ffd2c4}
  .opt input:checked ~ .mark{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt input:checked ~ .txt{font-weight:600}

  textarea{width:calc(100% - 42px);margin:14px 0 0 42px;min-height:110px;padding:12px 14px;
           border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14.5px;resize:vertical}

  /* 답안 요약 */
  .sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .cell{border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;font-size:12px;
        color:var(--sub);cursor:pointer;text-decoration:none}
  .cell b{display:block;font-size:15px;color:var(--text);min-height:20px}
  .cell.on{border-color:var(--accent);background:var(--accent-soft)}
  .cell.on b{color:var(--accent)}
  pre{margin-top:18px;background:#16181d;color:#e7e9ee;border-radius:12px;padding:16px;
      font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;
      max-height:320px;overflow:auto}
  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  button{font:inherit;font-weight:700;font-size:15px;border:none;border-radius:12px;
         padding:14px 20px;cursor:pointer;transition:.15s}
  .primary{flex:1;background:var(--accent);color:#fff}
  .primary:hover{filter:brightness(.95)}
  .ghost{background:#fff;border:1px solid var(--line);color:var(--sub)}
  .ghost:hover{color:var(--text)}

  .toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);opacity:0;
         background:#16181d;color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;
         transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:600px){
    h1{font-size:24px}.info{grid-template-columns:repeat(2,1fr)}
    .opts,.box,.cond{margin-left:0}textarea{width:100%;margin-left:0}
    .grid{grid-template-columns:repeat(5,1fr)}
  }
  @media print{.topbar,.btns,pre,.toast{display:none}body{background:#fff}.q{break-inside:avoid}}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <b>국어 형성 평가</b><div class="bar"><i id="bar"></i></div><span class="count" id="count">0 / 25</span>
</div></div>

<div class="wrap">
  <header>
    <span class="tag">2학기 중간고사 대비</span>
    <h1>국어 형성 평가</h1>
    <div class="meta"><span>범위 · 읽기·쓰기·문학·대화</span><span>시간 · 45분</span><span>총점 · 100점</span></div>
    <div class="info">
      <div><label>학년</label><input id="grade" placeholder="2"></div>
      <div><label>반</label><input id="cls" placeholder="3"></div>
      <div><label>번호</label><input id="no" placeholder="15"></div>
      <div><label>이름</label><input id="name" placeholder="홍길동"></div>
    </div>
    <ul class="notice">
      <li>선택형 1~20번은 각 3점, 서술형 1~5번은 각 8점입니다.</li>
      <li>선택형은 가장 알맞은 답을 하나만 고르세요.</li>
      <li>답은 자동 저장됩니다. 다 풀면 맨 아래 <b>답안 복사</b> 버튼을 누르세요.</li>
    </ul>
  </header>

  <h2>선택형</h2>
  <div id="mc"></div>

  <h2>서술형</h2>
  <div id="es"></div>

  <h2>답안 확인</h2>
  <div class="sheet">
    <div class="grid" id="grid"></div>
    <pre id="preview"></pre>
    <div class="btns">
      <button class="primary" id="copy">답안 전체 복사</button>
      <button class="ghost" id="reset">초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const C = ['①','②','③','④','⑤'];

const MC = [
 {q:`다음 중 '읽기 전' 단계에서 하는 활동으로 알맞은 것은?`,
  o:[`문단의 중심 내용 파악하기`,`질문을 만들고 답 찾기`,`차례와 제목을 훑어보며 내용 예측하기`,`자신의 읽기 과정 평가하기`,`글의 주제와 주요 내용 정리하기`]},
 {q:`&lt;보기&gt;의 학생이 한 활동으로 가장 알맞은 것은?`,
  b:`수아는 글을 읽다가 '쥘 리메'가 누구인지 몰라서 글의 흐름이 이해되지 않았다. 그래서 읽기를 잠시 멈추고 인터넷 백과사전에서 그 인물을 찾아본 뒤 다시 읽었다.`,
  o:[`점검만 하였다.`,`조정만 하였다.`,`점검한 뒤 그 결과에 따라 조정하였다.`,`읽기 전에 배경지식을 활성화하였다.`,`읽은 후에 더 알고 싶은 내용을 찾았다.`]},
 {q:`읽기 단계와 전략을 바르게 짝지은 것은?`,
  o:[`읽기 전: 더 알고 싶은 내용 찾기`,`읽기 전: 모르는 단어 찾기`,`읽는 중: 배경지식 떠올리기`,`읽는 중: 중요한 내용 표시하기`,`읽은 후: 읽기 목적 확인하기`]},
 {q:`「세계사를 바꾼 월드컵」에 대한 설명으로 알맞은 것은?`,
  o:[`하근찬이 쓴 소설이다.`,`월드컵의 유래와 역사를 다룬 글이다.`,`월드컵 경기 규칙만 설명한 글이다.`,`최초의 진정한 월드컵에 대한 견해는 실려 있지 않다.`,`운동선수가 자신의 체험을 쓴 수필이다.`]},
 {q:`점검과 조정을 하며 읽을 때 얻는 효과가 <u>아닌</u> 것은?`,
  o:[`내용을 깊이 이해할 수 있다.`,`읽은 내용을 오래 기억할 수 있다.`,`효율적으로 읽을 수 있다.`,`글을 읽는 속도가 언제나 빨라진다.`,`능동적인 독자로 성장할 수 있다.`]},
 {q:`복합양식 자료에 대한 설명으로 알맞은 것은?`,
  o:[`문자 한 가지 기호로만 이루어진 자료이다.`,`문자, 소리·음악, 그림, 사진, 동영상 등 여러 기호를 결합한 자료이다.`,`인쇄 매체에만 나타난다.`,`웹 페이지는 복합양식 자료에 속하지 않는다.`,`방송 영상은 소리만 있으므로 복합양식 자료가 아니다.`]},
 {q:`'내용 조직'의 뜻으로 가장 알맞은 것은?`,
  o:[`쓸 내용을 떠올리는 것`,`쓸 내용을 일정한 기준과 절차에 따라 틀을 짜서 엮는 것`,`다 쓴 글을 고치는 것`,`글의 주제를 정하는 것`,`자료의 출처를 확인하는 것`]},
 {q:`&lt;보기&gt;의 자료 가운데 '신뢰성' 기준에 가장 잘 맞는 것은?`,
  b:`ㄱ. 작성자를 알 수 없는 SNS 게시물<br>ㄴ. 질병관리청이 올해 발표한 보고서(출처와 날짜가 밝혀져 있음)<br>ㄷ. 친구가 들었다고 전한 이야기<br>ㄹ. 제작 시기가 나와 있지 않은 인터넷 카페의 그림`,
  o:[`ㄱ`,`ㄴ`,`ㄷ`,`ㄹ`,`ㄱ, ㄴ`]},
 {q:`&lt;보기&gt;와 같이 내용을 조직하기에 가장 알맞은 글의 유형은?`,
  b:`<b>처음</b> 학교 안에서 휴대 전화 사용을 제한해야 한다.<br><b>중간</b> 수업 집중력이 높아지기 때문이다(통계 자료). 친구와 직접 대화하는 시간이 늘어난다(설문 결과). 위급할 때 연락이 어렵다는 반론이 있을 수 있지만, 교무실 전화를 이용하면 된다.<br><b>끝</b> 주장 강조`,
  o:[`정보 전달 글`,`설득하는 글`,`정서 표현 글`,`수필`,`기행문`]},
 {q:`정서 표현 글(수필)의 내용 조직 방법으로 알맞은 것은?`,
  o:[`주장을 제시하고 근거를 든다.`,`예상 반론을 쓰고 반박한다.`,`체험을 먼저 쓰고 깨달음을 뒤에 쓴다.`,`공간의 순서에 따라 대상을 설명한다.`,`논리적 순서로 정보를 나열한다.`]},
 {q:`「수난이대」의 갈래와 작가를 바르게 짝지은 것은?`,
  o:[`장편 소설, 하근찬`,`현대 단편 소설, 하근찬`,`수필, 이종성`,`시, 하근찬`,`고전 소설, 작자 미상`]},
 {q:`「수난이대」에서 '수난이대'라는 제목이 뜻하는 것은?`,
  o:[`두 나라가 겪은 수난`,`아버지와 아들, 두 세대가 겪은 수난`,`두 번의 전쟁에서 이긴 이야기`,`두 형제의 갈등`,`한 인물이 두 번 다친 사건`]},
 {q:`다음 중 사건의 순서가 바른 것은?`,
  o:[`진수와 만남 → 정거장으로 마중 → 외나무다리 건넘 → 징용 회상`,
     `정거장으로 마중 → 징용 회상 → 다리 잃은 진수와 만남 → 아들을 위로함 → 외나무다리를 함께 건넘`,
     `징용 회상 → 외나무다리 건넘 → 정거장으로 마중 → 진수와 만남`,
     `외나무다리 건넘 → 진수와 만남 → 아들을 위로함 → 징용 회상`,
     `정거장으로 마중 → 외나무다리 건넘 → 징용 회상 → 진수와 만남`]},
 {q:`'만도'에 대한 설명으로 알맞지 <u>않은</u> 것은?`,
  o:[`일제 강점기 징용으로 한쪽 팔을 잃었다.`,`아들을 마중하러 정거장으로 간다.`,`다리를 잃고 돌아온 아들을 보고 충격을 받는다.`,`끝까지 아들의 처지를 비관하며 아들을 원망한다.`,`아들을 위로하며 함께 살아갈 방도를 제시한다.`]},
 {q:`'진수'의 처지와 심리로 알맞은 것은?`,
  o:[`일제 강점기에 징용을 갔다가 팔을 잃었다.`,`한국 전쟁에 참전하여 다리를 잃었고, 앞으로 살아갈 일에 막막해한다.`,`다친 곳 없이 돌아와 아버지를 위로한다.`,`아버지를 원망하며 집을 떠난다.`,`처음부터 끝까지 자신감이 넘친다.`]},
 {q:`「수난이대」의 결말 장면이 상징하는 것으로 가장 알맞은 것은?`,
  o:[`세대 간 갈등은 해결될 수 없다.`,`서로 힘을 합치면 수난을 극복할 수 있다.`,`전쟁에서 승리한 기쁨`,`아버지의 일방적인 희생`,`고향을 떠나려는 의지`]},
 {q:`갈등을 조정할 때 첫 번째로 할 일로 가장 알맞은 것은?`,
  o:[`상대의 잘못을 지적한다.`,`서로의 입장을 파악하고 갈등의 원인을 분석한다.`,`무조건 내가 양보한다.`,`대화를 피한다.`,`제3자에게 판단을 맡긴다.`]},
 {q:`웹툰 「오빠와 엄마」에 대한 설명으로 알맞은 것은?`,
  o:[`영훈은 엄마가 동생 나리만 예뻐한다고 생각해 서운해한다.`,`엄마는 영훈이 시험을 잘 봐서 칭찬한다.`,`영훈과 엄마는 처음부터 서로의 말을 귀 기울여 듣는다.`,`나리가 오빠를 비난해서 갈등이 생긴다.`,`갈등은 대화 없이 저절로 해결된다.`]},
 {q:`진솔하게 표현하지 않을 때 생기는 일로 알맞은 것은?`,
  o:[`상대가 내 생각과 감정을 정확히 알게 된다.`,`오해가 생겨 갈등이 커질 수 있다.`,`갈등의 원인이 쉽게 드러난다.`,`서로 기대하는 바를 파악하기 쉬워진다.`,`효과적으로 조정할 수 있다.`]},
 {q:`다음 중 갈등 조정에 알맞은 말은?`,
  o:[`"넌 원래 그런 애잖아."`,`"와, 참 잘하셨네요." (비꼬는 말투로)`,`"그건 내 잘못 아니야, 몰라."`,`"네가 어제 약속에 늦어서 나는 걱정됐어. 다음엔 미리 연락해 줄래?"`,`"너는 한 번도 약속을 지킨 적이 없어."`]}
];

const ES = [
 {q:`'점검'과 '조정'의 차이를 예를 들어 설명하시오.`,
  c:`조건: 두 개념의 뜻을 각각 밝히고, 하나의 읽기 상황을 예로 들 것`},
 {q:`다음 자료의 문제점을 '자료 점검 기준'에 따라 두 가지 쓰시오.`,
  b:`'우리 반 친구들의 독서량'에 관한 정보 전달 글을 쓰면서, 출처가 없는 인터넷 게시판에 올라온 '성인 독서량 순위' 그림을 사용하려고 한다.`},
 {q:`「수난이대」에서 만도와 진수가 겪은 수난을 시대 배경과 함께 각각 쓰시오.`},
 {q:`「수난이대」의 작가가 이 작품을 통해 전하려는 의도를 결말 장면과 관련지어 쓰시오.`},
 {q:`다음 말을 갈등을 조정하는 표현으로 고쳐 쓰시오.`,
  b:`(친구가 모둠 과제를 하지 않았을 때) "너는 맨날 놀기만 하고, 우리 모둠 망치는 건 항상 너야!"`,
  c:`조건: 사실, 자신의 감정, 바라는 점이 모두 드러나게 쓰고, 일반화·과장하는 표현을 쓰지 말 것`}
];

const KEY = 'korean-exam-v1';
const $ = s => document.querySelector(s);

/* 렌더링 */
$('#mc').innerHTML = MC.map((it,i)=>{
  const n=i+1;
  return `<section class="q" id="q${n}">
    <div class="q-head"><span class="q-num">${n}</span><p class="q-text">${it.q}</p><span class="pts">3점</span></div>
    ${it.b?`<div class="box"><span class="bt">&lt;보기&gt;</span>${it.b}</div>`:''}
    <div class="opts">${it.o.map((t,k)=>`
      <label class="opt"><input type="radio" name="mc${n}" value="${k}">
      <span class="mark">${k+1}</span><span class="txt">${t}</span></label>`).join('')}
    </div></section>`;
}).join('');

$('#es').innerHTML = ES.map((it,i)=>{
  const n=i+1;
  return `<section class="q" id="s${n}">
    <div class="q-head"><span class="q-num">${n}</span><p class="q-text">${it.q}</p><span class="pts">8점</span></div>
    ${it.b?`<div class="box">${it.b}</div>`:''}
    ${it.c?`<p class="cond">${it.c}</p>`:''}
    <textarea id="es${n}" placeholder="답안을 문장으로 쓰세요."></textarea></section>`;
}).join('');

$('#grid').innerHTML =
  MC.map((_,i)=>`<a class="cell" href="#q${i+1}" id="c${i+1}">${i+1}<b></b></a>`).join('') +
  ES.map((_,i)=>`<a class="cell" href="#s${i+1}" id="cs${i+1}">서${i+1}<b></b></a>`).join('');

/* 상태 */
const getMC = n => { const r=document.querySelector(`input[name="mc${n}"]:checked`); return r?+r.value:null; };
const infoIds = ['grade','cls','no','name'];

function buildText(){
  const v = id => $('#'+id).value.trim() || '-';
  let t = `[국어 형성 평가 답안]\n학년: ${v('grade')}  반: ${v('cls')}  번호: ${v('no')}  이름: ${v('name')}\n\n[선택형]\n`;
  for(let r=0;r<4;r++){
    const row=[];
    for(let c=1;c<=5;c++){ const n=r*5+c, a=getMC(n); row.push(`${n}: ${a===null?'-':C[a]}`); }
    t += row.join('   ') + '\n';
  }
  t += '\n[서술형]\n';
  ES.forEach((_,i)=>{ t += `${i+1}: ${$('#es'+(i+1)).value.trim() || '(미작성)'}\n`; });
  return t;
}

function update(){
  let done=0;
  MC.forEach((_,i)=>{
    const n=i+1, a=getMC(n), on=a!==null;
    if(on) done++;
    $('#q'+n).classList.toggle('done',on);
    $('#c'+n).classList.toggle('on',on);
    $('#c'+n).querySelector('b').textContent = on?C[a]:'';
  });
  ES.forEach((_,i)=>{
    const n=i+1, on=$('#es'+n).value.trim()!=='';
    if(on) done++;
    $('#s'+n).classList.toggle('done',on);
    $('#cs'+n).classList.toggle('on',on);
    $('#cs'+n).querySelector('b').textContent = on?'✓':'';
  });
  $('#count').textContent = `${done} / 25`;
  $('#bar').style.width = (done/25*100)+'%';
  $('#preview').textContent = buildText();
}

function save(){
  const d={info:{},mc:{},es:{}};
  infoIds.forEach(id=>d.info[id]=$('#'+id).value);
  MC.forEach((_,i)=>d.mc[i+1]=getMC(i+1));
  ES.forEach((_,i)=>d.es[i+1]=$('#es'+(i+1)).value);
  localStorage.setItem(KEY,JSON.stringify(d));
}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)); if(!d) return;
    infoIds.forEach(id=>$('#'+id).value=d.info[id]||'');
    Object.entries(d.mc).forEach(([n,a])=>{ if(a!==null){ const r=document.querySelector(`input[name="mc${n}"][value="${a}"]`); if(r) r.checked=true; }});
    Object.entries(d.es).forEach(([n,v])=>$('#es'+n).value=v||'');
  }catch(e){}
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

document.addEventListener('input',()=>{ update(); save(); });
document.addEventListener('change',()=>{ update(); save(); });

$('#copy').addEventListener('click',async()=>{
  const text=buildText();
  const blank = 25 - +$('#count').textContent.split('/')[0];
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(blank>0 ? `복사 완료! (안 푼 문항 ${blank}개)` : '복사 완료! 채팅창에 붙여 넣으세요');
});

$('#reset').addEventListener('click',()=>{
  if(!confirm('모든 답안을 지울까요?')) return;
  localStorage.removeItem(KEY);
  document.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);
  document.querySelectorAll('textarea, .info input').forEach(el=>el.value='');
  update(); toast('초기화했어요');
});

load(); update();
</script>
</body>
</html>
